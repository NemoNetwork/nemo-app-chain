syntax = "proto3";
package nemo_network.vault;

import "nemo_network/vault/vault.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/nemo-network/v4-chain/protocol/x/vault/types";

// QuotingParams stores vault quoting parameters.
message QuotingParams {
  // The number of layers of orders a vault places. For example if
  // `layers=2`, a vault places 2 asks and 2 bids.
  uint32 layers = 1;

  // The minimum base spread when a vault quotes around reservation price.
  uint32 spread_min_ppm = 2;

  // The buffer amount to add to min_price_change_ppm to arrive at `spread`
  // according to formula:
  // `spread = max(spread_min_ppm, min_price_change_ppm + spread_buffer_ppm)`.
  uint32 spread_buffer_ppm = 3;

  // The factor that determines how aggressive a vault skews its orders.
  uint32 skew_factor_ppm = 4;

  // The percentage of vault equity that each order is sized at.
  uint32 order_size_pct_ppm = 5;

  // The duration that a vault's orders are valid for.
  uint32 order_expiration_seconds = 6;

  // The number of quote quantums in quote asset that a vault with no perpetual
  // positions must have to activate, i.e. if a vault has no perpetual positions
  // and has strictly less than this amount of quote asset, it will not
  // activate.
  bytes activation_threshold_quote_quantums = 7 [
    (gogoproto.customtype) =
        "github.com/nemo-network/v4-chain/protocol/dtypes.SerializableInt",
    (gogoproto.nullable) = false
  ];
}

// VaultParams stores vault parameters.
message VaultParams {
  // Status of the vault.
  VaultStatus status = 1;
  // Quoting parameters of the vault.
  QuotingParams quoting_params = 2;
}

// OperatorParams stores parameters regarding megavault operator.
message OperatorParams {
  // Address of the operator.
  string operator = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // Metadata of the operator.
  OperatorMetadata metadata = 2 [ (gogoproto.nullable) = false ];

  // Fields 3-5 are fork-local; see x/vault/spec/adr-001-megavault-fees.md.
  // They are appended rather than placed in a separate message so that they
  // stay gov-only: `MsgUpdateOperatorParams` is an internal (gov-proposal-only)
  // message, so the operator cannot raise its own fee.

  // Annualized management fee charged on megavault NAV, in parts-per-million.
  // Charged regardless of performance.
  uint32 operator_fee_ppm = 3;

  // Share of gains above the high-water mark that accrues to the operator, in
  // parts-per-million.
  uint32 profit_share_ppm = 4;

  // Minimum fraction of total shares that the operator must retain, in
  // parts-per-million. Enforced by rejecting operator withdrawals that would
  // breach it, never by rejecting user deposits.
  uint32 min_operator_share_ppm = 5;
}

// FeeState stores the megavault fee accounting state.
//
// Note: fork-local; see x/vault/spec/adr-001-megavault-fees.md.
message FeeState {
  // The highest NAV per share that megavault has ever reached after fee
  // dilution, scaled by 1e18. A profit share is charged only on the excess of
  // current NAV per share over this mark.
  bytes high_water_mark_nav_per_share = 1 [
    (gogoproto.customtype) =
        "github.com/nemo-network/v4-chain/protocol/dtypes.SerializableInt",
    (gogoproto.nullable) = false
  ];

  // Unix timestamp in seconds of the last accrual that actually minted shares.
  // Deliberately not advanced by an accrual that rounded to zero, so that a fee
  // rate too small to be representable over one interval still accrues once
  // enough time has passed.
  int64 last_accrual_time = 2;
}

// MegavaultParams stores megavault-level parameters.
//
// Note: this message has no upstream dydxprotocol equivalent. It holds the
// parameters that apply to megavault as a whole rather than to an individual
// vault (quoting params) or to the operator's identity (operator params).
message MegavaultParams {
  // The maximum number of quote quantums that megavault equity may reach
  // through deposits. A deposit is rejected if megavault equity after the
  // deposit would exceed this cap.
  //
  // A value of zero means no cap, so that a chain upgraded from a state that
  // predates this field keeps accepting deposits until the cap is set.
  bytes deposit_cap_quote_quantums = 1 [
    (gogoproto.customtype) =
        "github.com/nemo-network/v4-chain/protocol/dtypes.SerializableInt",
    (gogoproto.nullable) = false
  ];
}

// OperatorMetadata stores metadata regarding megavault operator.
message OperatorMetadata {
  // Name of the operator.
  string name = 1;
  // Description of the operator.
  string description = 2;
}

// Deprecated: Params stores `x/vault` parameters.
// Deprecated since v6.x as is replaced by QuotingParams.
message Params {
  // The number of layers of orders a vault places. For example if
  // `layers=2`, a vault places 2 asks and 2 bids.
  uint32 layers = 1;

  // The minimum base spread when a vault quotes around reservation price.
  uint32 spread_min_ppm = 2;

  // The buffer amount to add to min_price_change_ppm to arrive at `spread`
  // according to formula:
  // `spread = max(spread_min_ppm, min_price_change_ppm + spread_buffer_ppm)`.
  uint32 spread_buffer_ppm = 3;

  // The factor that determines how aggressive a vault skews its orders.
  uint32 skew_factor_ppm = 4;

  // The percentage of vault equity that each order is sized at.
  uint32 order_size_pct_ppm = 5;

  // The duration that a vault's orders are valid for.
  uint32 order_expiration_seconds = 6;

  // The number of quote quantums in quote asset that a vault with no perpetual
  // positions must have to activate, i.e. if a vault has no perpetual positions
  // and has strictly less than this amount of quote asset, it will not
  // activate.
  bytes activation_threshold_quote_quantums = 7 [
    (gogoproto.customtype) =
        "github.com/nemo-network/v4-chain/protocol/dtypes.SerializableInt",
    (gogoproto.nullable) = false
  ];
}
